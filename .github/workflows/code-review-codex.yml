name: Code Review Bot (Codex) (paused)

# Fail closed until the agent, sandbox and authentication are reviewed.
# See .github/WORKFLOW_SECURITY.md before restoring automation.
on:
  workflow_dispatch:

permissions: {}

jobs:
  automation-paused:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Report paused automation
        shell: bash
        run: |
          printf '%s\n' 'ERROR: This automation is paused for security hardening. See .github/WORKFLOW_SECURITY.md. No Codex task was performed.'
          exit 1
